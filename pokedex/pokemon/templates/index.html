{% load static %}
{% load custom_filters %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex - Modern & Clear</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

        /* --- High Contrast & Crisp Color Tokens --- */
        :root {
            --bg-gradient-start: #E2E8F0;
            --bg-gradient-end: #F8FAFC;
            --surface-color: #FFFFFF;
            --text-main: #0F172A; /* Deep slate for high visibility */
            --text-muted: #64748B;
            --primary-color: #2563EB; /* Vibrant Blue */
            --primary-bg: #EFF6FF;
            --border-color: #E2E8F0;
            --glass-bg: rgba(255, 255, 255, 0.7);
            
            /* Elevations */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);

            /* Animations */
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            overflow-x: hidden;
        }

        /* --- Glassmorphism Top App Bar --- */
        .header.home {
            width: 100%;
            max-width: 1200px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px); /* Strong blur added */
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 32px;
            padding: 20px 32px;
            margin-bottom: 40px;
            position: sticky;
            top: 24px;
            z-index: 1000;
            box-shadow: var(--shadow-md);
            transition: var(--transition-smooth);
        }

        .header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
            width: 100%;
        }

        .header .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header .logo-wrapper img {
            width: 48px;
            height: 48px;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .header .logo-wrapper:hover img {
            transform: rotate(180deg) scale(1.1);
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        /* --- Search Bar --- */
        .header .search-wrapper {
            flex-grow: 1;
            max-width: 450px;
            display: flex;
            justify-content: flex-end;
        }

        .header .search-wrap {
            position: relative;
            width: 100%;
        }

        .header .search-icon,
        .header .search-close-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            cursor: pointer;
            opacity: 0.5; /* Improved icon contrast */
            transition: opacity 0.2s;
            filter: brightness(0); /* Forces icons to be visible dark gray/black */
        }

        .header .search-icon { left: 20px; }
        .header .search-close-icon { 
            right: 20px; 
            display: none; 
            opacity: 0.7;
        }

        .header .search-wrap:hover .search-icon,
        .header .search-wrap:hover .search-close-icon {
            opacity: 0.8;
        }

        .header .search-input {
            width: 100%;
            padding: 16px 56px;
            border: 2px solid transparent;
            border-radius: 9999px;
            background-color: rgba(255, 255, 255, 0.9);
            font-size: 1.05rem;
            font-family: inherit;
            font-weight: 500;
            color: var(--text-main);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            transition: var(--transition-smooth);
        }

        .header .search-input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .header .search-input:focus {
            outline: none;
            background-color: #FFFFFF;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px var(--primary-bg);
        }

        /* --- Main Content & Pokemon List --- */
        .main {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .pokemon-list {
            width: 100%;
            max-width: 1200px;
        }

        .list-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 28px;
            padding-bottom: 60px;
        }

        /* --- Crisp Filled Card --- */
        .list-item {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: var(--transition-smooth);
            opacity: 0;
            animation: popIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            animation-delay: calc(var(--animation-order) * 40ms);
        }

        .list-item:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: var(--shadow-hover);
            border-color: rgba(37, 99, 235, 0.3); /* Subtle blue border on hover */
        }

        /* --- Card Content --- */
        .number-wrap {
            background-color: var(--primary-bg);
            color: var(--primary-color);
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 0.9rem;
            font-weight: 700;
            align-self: flex-start;
            margin-bottom: 20px;
        }

        .img-wrap {
            height: 130px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            position: relative;
        }

        .img-wrap::before {
            content: '';
            position: absolute;
            width: 110px;
            height: 110px;
            background-color: #F8FAFC;
            border-radius: 50%;
            z-index: 0;
            transition: var(--transition-smooth);
        }

        .img-wrap img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            z-index: 1;
            transition: var(--transition-smooth);
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
        }

        .list-item:hover .img-wrap::before {
            transform: scale(1.15);
            background-color: var(--primary-bg);
        }

        .list-item:hover .img-wrap img {
            transform: scale(1.1) translateY(-6px);
        }

        .name-wrap p {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-main);
            text-transform: capitalize;
            text-align: center;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #not-found-message {
            display: none;
            font-size: 1.5rem;
            color: var(--text-muted);
            text-align: center;
            width: 100%;
            padding: 40px;
            font-weight: 500;
            background: var(--surface-color);
            border-radius: 28px;
            border: 1px solid var(--border-color);
            grid-column: 1 / -1;
        }

        /* --- Animations --- */
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.9) translateY(30px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            body { padding: 16px; }
            .header.home {
                padding: 16px 20px;
                border-radius: 28px;
                position: relative;
                top: 0;
            }
            .header .container {
                flex-direction: column;
                align-items: stretch;
                gap: 16px;
            }
            .header h1 { font-size: 2rem; text-align: center; }
            .header .logo-wrapper { justify-content: center; }
            .header .search-wrapper { max-width: 100%; }
            .list-wrapper { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
            .list-item { padding: 20px 16px; border-radius: 24px; }
            .img-wrap { height: 100px; }
            .img-wrap img { width: 90px; height: 90px; }
            .img-wrap::before { width: 85px; height: 85px; }
        }
    </style>
</head>

<body>
    <header class="header home">
        <div class="container">
            <div class="logo-wrapper">
                <img src="{% static 'assets/pokeball.png' %}" alt="pokeball">
                <h1>Pokedex</h1>
            </div>
            <div class="search-wrapper">
                <div class="search-wrap">
                    <img src="{% static 'assets/search.svg' %}" alt="search icon" class="search-icon">
                    <input type="text" class="search-input" placeholder="Search by Name or ID" id="search-input">
                    <img src="{% static 'assets/cross.svg' %}" alt="cross icon" class="search-close-icon" id="search-close-icon">
                </div>
            </div>
        </div>
    </header>

    <main class="main">
        <section class="pokemon-list">
            <div class="list-wrapper" id="pokemon-list">
                {% for pokemon in pokemons %}
                <div class="list-item" onclick="window.location.href='{% url 'detail' pokemon.id %}'" data-name="{{ pokemon.name }}" data-id="{{ pokemon.id }}" style="--animation-order: {{ forloop.counter0 }};">
                    <div class="number-wrap">
                        <p>#{{ pokemon.id }}</p> 
                    </div>
                    <div class="img-wrap">
                        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/{{ pokemon.id }}.svg" alt="{{ pokemon.name }}">
                    </div>
                    <div class="name-wrap">
                        <p>{{ pokemon.name|capfirst }}</p>
                    </div>
                </div>
                {% endfor %}
            </div>
            <div id="not-found-message">No Pokémon found matching your search.</div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const searchInput = document.getElementById('search-input');
            const searchCloseIcon = document.getElementById('search-close-icon');
            const pokemonList = document.getElementById('pokemon-list');
            const listItems = pokemonList.getElementsByClassName('list-item');
            const notFoundMessage = document.getElementById('not-found-message');

            searchInput.addEventListener('input', function () {
                const searchTerm = searchInput.value.toLowerCase().trim();
                let found = false;

                Array.from(listItems).forEach(item => {
                    const name = item.getAttribute('data-name').toLowerCase();
                    const id = item.getAttribute('data-id');
                    if (name.includes(searchTerm) || id.includes(searchTerm)) {
                        item.style.display = '';
                        found = true;
                    } else {
                        item.style.display = 'none';
                    }
                });

                notFoundMessage.style.display = found ? 'none' : 'block';
                searchCloseIcon.style.display = searchTerm ? 'inline' : 'none';
            });

            searchCloseIcon.addEventListener('click', function () {
                searchInput.value = '';
                searchInput.dispatchEvent(new Event('input'));
                searchInput.focus();
            });
        });
    </script>
</body>
</html>
